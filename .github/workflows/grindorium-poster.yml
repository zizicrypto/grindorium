name: Grindorium Poster (cloud)

on:
  # 2026-07-16: Ali onayladi, PC'deki main.py durduruldu + Task Scheduler
  # gorevleri (GrindoriumPoster*) devre disi birakildi. Bulut artik TEK
  # aktif paylasici.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (gercek paylasim yapma)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: grindorium-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grindorium_poster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build config.json from secrets
        run: python build_config.py
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.GRINDORIUM_YOUTUBE_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.GRINDORIUM_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.GRINDORIUM_IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.GRINDORIUM_FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.GRINDORIUM_FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_COOKIES_B64: ${{ secrets.GRINDORIUM_YOUTUBE_COOKIES_B64 }}

      - name: Run cloud_poster
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python cloud_poster.py --dry-run
          else
            python cloud_poster.py
          fi

      - name: Commit posting_plan.json if changed
        run: |
          git config user.name "grindorium-bot"
          git config user.email "bot@grindorium.org"
          if [ ! -f posting_plan.json ]; then
            echo "posting_plan.json henuz olusmadi (paylasim yapilmadi)"
            exit 0
          fi
          git add posting_plan.json
          if git diff --cached --quiet; then
            echo "posting_plan.json unchanged"
            exit 0
          fi
          git commit -m "grindorium_poster: posting_plan.json guncellendi"
          # push cakismasi (baska bir surec ayni anda push ettiyse) ihtimaline
          # karsi birkac kez rebase+retry - "paylasildi" bilgisi ASLA
          # kaybolmamali, yoksa bir sonraki calistirma ayni videoyu tekrar
          # paylasmaya kalkar (gercek cift-paylasim riski).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push basarisiz (deneme $i), rebase edip tekrar denenecek"
            git pull --rebase
          done
          echo "push 5 denemeden sonra basarisiz - posting_plan.json commit'i LOCAL'de kaldi, elle kontrol gerekir"
          exit 1
