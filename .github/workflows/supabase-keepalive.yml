name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query grid table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/grid_words?select=idx&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Unexpected status $STATUS"
            exit 1
          fi
          echo "OK: Supabase active"
