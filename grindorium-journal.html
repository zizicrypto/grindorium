<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="canonical" href="https://grindorium.org/journal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Micro Journal | Grindorium</title>
  <meta name="description" content="Three words. Every day. A small daily practice of naming what is present."/>
  <meta property="og:title" content="Micro Journal | Grindorium"/>
  <meta property="og:description" content="Three words. Every day. No explanation required."/>
  <meta property="og:image" content="https://grindorium.org/grindorium-character.png"/>
  <meta property="og:url" content="https://grindorium.org/journal"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#070b12;--bg2:#0e1520;--accent:#7eb8e8;--dim:#8aa0b8;--white:#ffffff;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{background:var(--bg);color:var(--white);font-family:'Space Mono',monospace;min-height:100vh;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:24px 48px;background:linear-gradient(to bottom,rgba(7,11,18,0.98),transparent);}
    .nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
    .nav-logo-img{width:28px;height:28px;border-radius:50%;object-fit:cover;}
    .nav-logo-text{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.2em;color:var(--white);text-transform:uppercase;}
    .nav-back{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none;text-transform:uppercase;letter-spacing:0.15em;transition:color 0.3s;}
    .nav-back:hover{color:var(--white);}
    .container{max-width:560px;margin:0 auto;padding:140px 48px 100px;}
    .page-label{font-size:10px;letter-spacing:0.3em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,56px);font-weight:300;color:var(--white);line-height:1.1;margin-bottom:12px;}
    .page-desc{font-size:14px;color:var(--dim);line-height:1.9;margin-bottom:56px;}
    .divider{height:1px;background:rgba(126,184,232,0.08);margin-bottom:48px;}
    .input-date{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#6b7f96;margin-bottom:12px;}
    .input-field{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(126,184,232,0.12);font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--white);padding:8px 0;outline:none;letter-spacing:0.05em;margin-bottom:8px;}
    .input-field::placeholder{color:#a8bdd0;}
    .word-count{font-size:9px;letter-spacing:0.12em;color:#a8bdd0;text-align:right;margin-bottom:24px;}
    .btn-row{display:flex;gap:8px;margin-bottom:56px;}
    .btn{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;padding:10px 20px;border:1px solid rgba(126,184,232,0.18);background:transparent;color:var(--accent);cursor:pointer;transition:all 0.2s;}
    .btn:hover{border-color:rgba(126,184,232,0.45);color:var(--white);}
    .btn.secondary{color:var(--dim);border-color:rgba(126,184,232,0.1);}
    .section-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#6b7f96;margin-bottom:16px;}
    .entry{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(126,184,232,0.04);}
    .entry-text{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--dim);}
    .entry-date{font-size:8px;letter-spacing:0.1em;color:#a8bdd0;}
    .empty{font-size:12px;letter-spacing:0.1em;color:#a8bdd0;padding:24px 0;}
    .map-section{margin-top:40px;}
    .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}
    .dot{width:12px;height:12px;border-radius:50%;background:rgba(126,184,232,0.06);border:1px solid rgba(126,184,232,0.08);cursor:default;}
    .dot.filled{background:rgba(126,184,232,0.2);border-color:rgba(126,184,232,0.3);}
    .sound-btn{position:fixed;bottom:80px;right:24px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(126,184,232,0.25);background:rgba(7,11,18,0.95);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;}
    .sound-icon{font-size:14px;color:var(--dim);}
    @media(max-width:600px){nav{padding:16px 20px;}.container{padding:110px 20px 80px;}}
  </style>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070b12">
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <picture><source srcset="/grindorium-character.webp" type="image/webp"/><img src="/grindorium-character.png" alt="" class="nav-logo-img" aria-hidden="true" onerror="this.style.display='none'"/></picture>
    <span class="nav-logo-text">Grindorium</span>
  </a>
  <a href="/" class="nav-back">← Home</a>
</nav>

<div class="container">
  <div class="page-label">Micro Journal</div>
  <h1 class="page-title">Three words.<br>Every day.</h1>
  <p class="page-desc">No sentences. No explanation. Just what is present right now. The practice is naming it, not analyzing it.</p>
  <div class="divider"></div>

  <div class="input-date" id="j-date"></div>
  <input class="input-field" id="j-input" type="text" placeholder="type here..." maxlength="60" oninput="jCount()" onkeydown="if(event.key==='Enter')jSave()"/>
  <div class="word-count" id="j-count">0 words</div>
  <div class="btn-row">
    <button class="btn" onclick="jSave()">Save</button>
    <button class="btn secondary" onclick="jClear()">Clear all</button>
  </div>

  <div class="section-label">Past entries</div>
  <div id="j-list"></div>
  <div id="j-empty" class="empty">No entries yet. Start with today.</div>

  <div class="map-section">
    <div class="section-label">This month</div>
    <div class="dots" id="j-dots"></div>
  </div>
</div>

<div class="sound-btn" onclick="toggleAmbient()"><span class="sound-icon" id="soundIcon">♪</span></div>

<script>
const KEY='grindorium_journal';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
function save(e){try{localStorage.setItem(KEY,JSON.stringify(e));}catch(e){}}
function fmt(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[d.getMonth()]+' '+d.getDate()+', '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function jCount(){const v=document.getElementById('j-input').value.trim();const w=v?v.split(/\s+/).filter(x=>x.length>0):[];document.getElementById('j-count').textContent=w.length+' word'+(w.length===1?'':'s');}
function jSave(){
  const v=document.getElementById('j-input').value.trim();if(!v)return;
  const entries=load();const now=new Date();
  entries.unshift({text:v,date:now.toISOString(),display:fmt(now)});
  if(entries.length>90)entries.pop();
  save(entries);document.getElementById('j-input').value='';document.getElementById('j-count').textContent='0 words';render();
}
function jClear(){if(confirm('Clear all journal entries?')){save([]);render();}}
function render(){
  const entries=load();
  const list=document.getElementById('j-list');
  const empty=document.getElementById('j-empty');
  list.innerHTML='';
  if(entries.length===0){empty.style.display='block';}
  else{
    empty.style.display='none';
    entries.slice(0,30).forEach(e=>{
      const row=document.createElement('div');
      row.className='entry';
      row.innerHTML=`<span class="entry-text">${e.text}</span><span class="entry-date">${e.display}</span>`;
      list.appendChild(row);
    });
  }
  const now=new Date();
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const dots=document.getElementById('j-dots');dots.innerHTML='';
  const days=new Set();
  entries.forEach(e=>{const d=new Date(e.date);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())days.add(d.getDate());});
  for(let i=1;i<=dim;i++){const d=document.createElement('div');d.className='dot'+(days.has(i)?' filled':'');d.title=i+'';dots.appendChild(d);}
}
document.getElementById('j-date').textContent=fmt(new Date());
render();
let ambientAudio=null,ambientOn=false;
function toggleAmbient(){
  if(ambientOn){if(ambientAudio)ambientAudio.pause();ambientOn=false;document.getElementById('soundIcon').style.color='var(--dim)';}
  else{ambientAudio=new Audio('/sigmaeffect-cinematic-ambient-atmosphere-463222.mp3');ambientAudio.loop=true;ambientAudio.volume=0.15;ambientAudio.play().catch(()=>{});ambientOn=true;document.getElementById('soundIcon').style.color='var(--accent)';}
}
</script>
</body>
</html>
